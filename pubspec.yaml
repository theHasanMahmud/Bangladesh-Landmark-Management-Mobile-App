name: vangti_chai
description: A responsive change calculator with a custom numeric keypad for the CSE 489 assignment.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  http: ^1.1.0
  flutter_map: ^4.0.0
  latlong2: ^0.9.0
  image_picker: ^0.8.7+4
  image: ^4.0.17
  path_provider: ^2.0.11
  sqflite: ^2.2.8+1
  path: ^1.8.3
  flutter_slidable: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
